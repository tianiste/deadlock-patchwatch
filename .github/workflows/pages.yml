name: Refresh data and deploy

on:
  push:
    branches: [main]
    paths: ["site/**", "build_data.py", ".github/workflows/pages.yml"]
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Fetch fresh patches, hero list and win rates. If an API is down, deploy the data
      # already committed in site/ (build_data.py only writes site/ after every fetch succeeds).
      - name: Refresh data
        run: python build_data.py || echo "::warning::Data refresh failed; deploying committed data"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
